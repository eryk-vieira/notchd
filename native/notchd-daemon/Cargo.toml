[package]
name = "notchd-daemon"
version = "0.7.3"
edition.workspace = true
license.workspace = true
description = "The notchd daemon and CLI."

[dependencies]
notchd-proto = { path = "../notchd-proto" }
notchd-core = { path = "../notchd-core" }
notchd-modules = { path = "../notchd-modules" }
notchd-providers = { path = "../notchd-providers" }
serde.workspace = true
serde_json.workspace = true
libc = "0.2.191"
# The terminal emulator (src/grid.rs): Ghostty's libghostty-vt, built from
# source at a pinned commit, which needs zig 0.15.2 on PATH
# (scripts/fetch-zig.sh; `make` puts it there).
libghostty-vt = "0.2.2"
# The kitty images: PNGs the programs send decoded, and what the view draws
# encoded.
png = "0.18.1"


[lib]
name = "notchd_daemon"
path = "src/lib.rs"

[[bin]]
name = "notchd"
path = "src/main.rs"

[dev-dependencies]
notchd-testkit = { path = "../notchd-testkit" }
